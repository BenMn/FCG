<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FC Gavot - Composition</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">FC Gavot</p>
          <h1>Compo loisir</h1>
        </div>
        <div class="topbar-actions">
          <button id="openPlayerModalButton" class="primary-button topbar-add-button" type="button">Ajouter un joueur</button>
          <label class="select-label" for="formatSelect" data-lineup-control>Format</label>
          <select id="formatSelect" class="formation-select format-select" data-lineup-control>
            <option value="11">Foot à 11</option>
            <option value="7">Foot à 7</option>
            <option value="5">Foot à 5</option>
          </select>
          <label class="select-label" for="formationSelect" data-lineup-control>Système</label>
          <select id="formationSelect" class="formation-select" data-lineup-control></select>
          <button id="resetLineupButton" class="icon-button" type="button" title="Vider le terrain" aria-label="Vider le terrain" data-lineup-control>
            <span aria-hidden="true">↺</span>
          </button>
        </div>
      </header>

      <nav class="app-tabs" aria-label="Navigation principale">
        <button class="tab-button is-active" type="button" data-view-tab="lineup">Composition</button>
        <button class="tab-button" type="button" data-view-tab="training">Entraînement</button>
      </nav>

      <main id="lineupView" class="layout app-view is-active">
        <section class="panel squad-panel" aria-labelledby="squadTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Effectif</p>
              <h2 id="squadTitle">Joueurs</h2>
            </div>
            <span id="playerCount" class="count-pill">0</span>
          </div>

          <div id="benchDropZone" class="bench-drop-zone">
            <div class="list-heading">
              <span>Disponibles</span>
              <span id="availableCount">0</span>
            </div>
            <div id="availablePlayers" class="player-list"></div>
          </div>
        </section>

        <section class="pitch-section" aria-label="Terrain">
          <div class="pitch-toolbar">
            <div>
              <p class="eyebrow">Terrain</p>
              <h2 id="formationTitle">4-4-2</h2>
            </div>
            <div class="lineup-meter">
              <span id="lineupCount">0</span>
              <span>/ 11</span>
            </div>
          </div>

          <div id="pitch" class="pitch" aria-live="polite">
            <div class="pitch-lines">
              <span class="center-circle"></span>
              <span class="center-line"></span>
              <span class="box box-top"></span>
              <span class="box box-bottom"></span>
              <span class="goal goal-top"></span>
              <span class="goal goal-bottom"></span>
            </div>
            <div id="formationSlots" class="formation-slots"></div>
          </div>
        </section>

        <aside class="panel details-panel" aria-labelledby="selectionTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Sélection</p>
              <h2 id="selectionTitle">Joueur</h2>
            </div>
          </div>
          <div id="selectionDetails" class="selection-details"></div>
        </aside>
      </main>

      <main id="trainingView" class="training-view app-view" aria-labelledby="trainingTitle">
        <section class="panel training-form-panel" aria-labelledby="trainingTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Entraînement</p>
              <h2 id="trainingTitle">Nouvelle séance</h2>
            </div>
          </div>

          <form id="sessionForm" class="training-form">
            <div class="form-row">
              <label for="sessionName">Nom de la séance</label>
              <input id="sessionName" name="sessionName" type="text" placeholder="Ex: Mardi - conservation" autocomplete="off" required>
            </div>

            <div class="exercise-builder">
              <div class="form-row">
                <label for="exerciseName">Exercice</label>
                <input id="exerciseName" name="exerciseName" type="text" placeholder="Ex: Toro 5v2" autocomplete="off">
              </div>

              <div class="exercise-controls">
                <div class="form-row">
                  <label for="exerciseDuration">Durée</label>
                  <input id="exerciseDuration" name="exerciseDuration" type="number" min="1" max="180" step="1" placeholder="min">
                </div>
                <div class="form-row">
                  <label for="exerciseObjective">Objectif</label>
                  <select id="exerciseObjective" name="exerciseObjective" class="formation-select"></select>
                </div>
              </div>

              <button id="addExerciseButton" class="secondary-button" type="button">Ajouter l'exercice</button>
            </div>

            <div id="draftExercises" class="exercise-list"></div>

            <button class="primary-button" type="submit">Créer la séance</button>
          </form>
        </section>

        <section class="panel training-sessions-panel" aria-labelledby="sessionsTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Programme</p>
              <h2 id="sessionsTitle">Séances</h2>
            </div>
            <span id="sessionCount" class="count-pill">0</span>
          </div>
          <div id="trainingSessions" class="training-sessions"></div>
        </section>
      </main>
    </div>

    <div id="playerModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="playerModalTitle">
        <div class="modal-heading">
          <div>
            <p class="eyebrow">Effectif</p>
            <h2 id="playerModalTitle">Nouveau joueur</h2>
          </div>
          <button id="closePlayerModalButton" class="icon-button modal-close-button" type="button" title="Fermer" aria-label="Fermer">×</button>
        </div>

        <form id="playerForm" class="player-form">
          <div class="form-row">
            <label for="playerName">Nom</label>
            <input id="playerName" name="playerName" type="text" autocomplete="off" required>
          </div>
          <fieldset class="positions-fieldset">
            <legend>Postes</legend>
            <div id="positionOptions" class="position-options"></div>
          </fieldset>
          <fieldset class="ratings-fieldset">
            <legend>Notes</legend>
            <div id="playerRatingOptions" class="rating-options"></div>
          </fieldset>
          <div class="modal-actions">
            <button class="secondary-button" type="button" data-close-modal>Annuler</button>
            <button class="primary-button" type="submit">Ajouter</button>
          </div>
        </form>
      </section>
    </div>

    <div id="slotPickerModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-slot-picker></div>
      <section class="modal-dialog slot-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="slotPickerTitle">
        <div class="modal-heading">
          <div>
            <p class="eyebrow">Terrain</p>
            <h2 id="slotPickerTitle">Choisir un joueur</h2>
          </div>
          <button id="closeSlotPickerButton" class="icon-button modal-close-button" type="button" title="Fermer" aria-label="Fermer">×</button>
        </div>
        <div id="slotPickerDetails" class="slot-picker-details"></div>
        <div id="slotPickerPlayers" class="slot-picker-list"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
